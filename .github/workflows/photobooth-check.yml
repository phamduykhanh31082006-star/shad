name: Photobooth source checks
on:
  push:
    paths:
      - "js/CaptionFilters.js"
      - "js/PhotoboothFilter.js"
      - "js/Locket_Filter_Probe.js"
      - "index.html"
      - "modules/Locket_Filter_Probe.sgmodule"
      - "photobooth/**"
      - ".github/workflows/photobooth-check.yml"
  pull_request:
    paths:
      - "js/CaptionFilters.js"
      - "photobooth/**"
jobs:
  caption-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/CaptionFilters.js
          node --check js/Photobooth.js
          node --check js/PhotoboothFilter.js
          node --check js/Locket_Filter_Probe.js
      - name: Test free caption presets
        run: |
          node photobooth/test-captions.cjs
          node photobooth/test-combined.cjs
          node photobooth/test-multishot.cjs
          node photobooth/test-shadowrocket-probe.cjs
          node photobooth/test-web-entry.cjs
